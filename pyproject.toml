[project]
name = "scihfs"
description = ""
authors = [
    {name = "Jan Philipp Sachs (jp-sachs, JPhSachs)"},
    {name = "Sonia Simons (sonnivs)"},
    {name = "Jasper Blum (Jasperhino)"},
    {name = "(saragrau)"},
    {name = "(dniprocat)"},
    {name = "Smilla Fox (sm1lla)"},
    {name = "(kathrinthenhausen)"},
]
dynamic = [ "version" ]
license = { file = "LICENSE"}
readme = "README.md"

[tool.poetry]
version = "0.1.0"

[tool.poetry.dependencies]
python = "^3.10"
info-gain = "^1.0.1"
networkx = "^3.2.1"
numpy = "^1.26.2"
pandas = "^2.2.3"
scikit-learn = "1.5.2"
scipy = "^1.15.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
black = "^24"
mypy = "^1.13.0"
isort = "^5.13.2"
pre-commit = "^4.0.1"
flake8 = "^7.1.1"
pytest-cov = "^6.0.0"
twine = "^6.1.0"

[tool.poetry.group.docs]
# will only be installed if group is explicitely named using
# poetry install --with docs
optional = true

[tool.poetry.group.docs.dependencies]
sphinxcontrib-bibtex = "^2.6.1"
sphinx-gallery = "^0.15.0"
sphinx-rtd-theme = "^2.0.0"
numpydoc = "^1.6.0"
matplotlib = "^3.8.2"
tomli = "^2.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 90
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
    | pyitlib.py
)/
'''

[tool.isort]
profile = "black"
line_length = 90
multi_line_output = 3
include_trailing_comma = true
known_third_party = ["numpy", "pandas"]
skip = [".venv", "build", "dist"]
