# Runs this job for pull requests and manual triggers.

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "doc/**"
      - "LICENSE"
      - ".gitignore"
      - ".devcontainer/**"
      - ".pre-commit-config.yaml"
      - ".readthedocs.yaml"
      - "Makefile"
  workflow_dispatch:

jobs:
  lint:
    name: Check linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable
        with:
          # cannot use use_pyproject to use settings from pyproject.toml below python 3.11
          options: "--line-length 90 scihfs"
  test:
    name: Run tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macOS-latest, windows-latest]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest scihfs --cov --cov-report=xml

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
