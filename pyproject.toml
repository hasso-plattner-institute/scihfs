[project]
name = "scihfs"
description = ""
authors = [
    {name = "Jan Philipp Sachs (jp-sachs, JPhSachs)"},
    {name = "Sonia Simons (sonnivs)"},
    {name = "Jasper Blum (Jasperhino)"},
    {name = "(saragrau)"},
    {name = "(dniprocat)"},
    {name = "Smilla Fox (sm1lla)"},
    {name = "(kathrinthenhausen)"},
]
version = "0.1.0"
license = { file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0.0,<4", # Clean major boundary, could technically be >=2.7.0
    "numpy>=2.0.0,<3", # Required for py3.13+ compatibility
    "scikit-learn>=1.6.0,<2", # First inclusion of validate_data
    "scipy>=1.15.0,<2",  # <1.15 has no 1D sparse slicing yet
]

[dependency-groups]
dev = [
    "ipykernel>=6.27.1,<7",
    "pytest>=7.4.4,<8",
    "black>=24,<25",
    "mypy>=1.13.0,<2",
    "isort>=5.13.2,<6",
    "pre-commit>=4.0.1,<5",
    "flake8>=7.1.1,<8",
    "setuptools==58.5.3",
    "sphinxcontrib-bibtex>=2.6.1,<3",
    "sphinx-gallery>=0.15.0,<1",
    "sphinx-rtd-theme>=2.0.0,<3",
    "numpydoc>=1.6.0,<2",
    "matplotlib>=3.8.2,<4",
    "pytest-cov>=6.0.0,<7",
    "twine>=6.1.0,<7",
    "tomli>=2.2.1,<3",
    "pandas>=2.2.2,<4",  # First version compatible with numpy 2.0+
    "polars>=1.0,<2",
    "dit>=2.1,<3 ; python_version >= '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 90
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 90
multi_line_output = 3
include_trailing_comma = true
known_third_party = ["dit", "numpy", "pandas"]
skip = [".venv", "build", "dist"]
