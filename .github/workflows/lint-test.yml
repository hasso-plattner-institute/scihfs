# Run this job on pushes to `main`, and for pull requests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable
        with:
          # cannot use use_pyproject to use settings from pyproject.toml below python 3.11
          options: "--line-length 90 scihfs"
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macOS-latest, windows-latest]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Debug Python build info (Windows 3.13/3.14)
        if: matrix.os == 'windows-latest' && (matrix.python-version == '3.13' || matrix.python-version == '3.14')
        run: |
          uv run python -c "import sys; print(sys.version); print(sys.flags)"
          uv run python -c "import numpy; print('numpy', numpy.__version__); numpy.show_config()"
          uv run python -c "import scipy; print('scipy', scipy.__version__)"
          uv run python -c "import sklearn; print('sklearn', sklearn.__version__)"

      - name: Run tests (Windows 3.13/3.14 with OpenBLAS workaround)
        if: matrix.os == 'windows-latest' && (matrix.python-version == '3.13' || matrix.python-version == '3.14')
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: uv run python -X faulthandler -m pytest scihfs --tb=short -q

      - name: Run tests (with coverage)
        if: "!(matrix.os == 'windows-latest' && (matrix.python-version == '3.13' || matrix.python-version == '3.14'))"
        run: uv run pytest scihfs --cov --cov-report=xml

      - name: Upload results to Codecov
        if: "!(matrix.os == 'windows-latest' && (matrix.python-version == '3.13' || matrix.python-version == '3.14'))"
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
